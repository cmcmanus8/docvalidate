server:
  # uploadUrl is the contract, so it has to reflect the URL the client actually called,
  # not the container's own host and port behind a TLS-terminating proxy.
  forward-headers-strategy: framework

spring:
  application:
    name: docvalidate

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Bounds how long a publish blocks with the broker down. The default is 60s,
        # which would hold the request thread of an upload that has already committed.
        max.block.ms: 5000
    listener:
      # One thread per partition, otherwise the three partitions are served serially.
      concurrency: 3
    consumer:
      group-id: docvalidate-workers
      auto-offset-reset: earliest
      # Each job pauses deliberately, so a large batch would outlast max.poll.interval.ms
      # and get the consumer evicted from the group mid-backlog.
      max-poll-records: 10
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.docvalidate.service.messaging
        spring.json.value.default.type: com.docvalidate.service.messaging.ValidationJob

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/docvalidate
    username: docvalidate
    password: docvalidate

  jpa:
    # Liquibase owns the schema. Hibernate only checks the mapping still matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: validation

  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml

docvalidate:
  # Which JobPublisher is wired: kafka, or local for an in-memory adapter with no broker.
  # Deliberately a property rather than a profile - as a profile it became the silent
  # default of every profile that was not called "kafka".
  messaging: kafka
  upload-window: PT15M
  max-upload-size: 10MB
  storage-root: ./.data
  jobs-topic: docvalidate.validation-jobs
  sweeper:
    enabled: true
    interval: PT1M
  # Makes the asynchronous lifecycle observable rather than instant.
  processing-delay: PT1S
  allowed-content-types:
    - application/pdf
    - image/png
    - image/jpeg
    - text/plain

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
