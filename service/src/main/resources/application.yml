server:
  # uploadUrl is the contract, so it has to reflect the URL the client actually called,
  # not the container's own host and port behind a TLS-terminating proxy.
  forward-headers-strategy: framework

spring:
  application:
    name: docvalidate

  profiles:
    # Kafka is the default path. The in-memory adapter takes over whenever this
    # profile is off, which is what every test but one runs against.
    default: kafka

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: docvalidate-workers
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.docvalidate.service.messaging
        spring.json.value.default.type: com.docvalidate.service.messaging.ValidationJob

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/docvalidate
    username: docvalidate
    password: docvalidate

  jpa:
    # Liquibase owns the schema. Hibernate only checks the mapping still matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: validation

  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml

docvalidate:
  upload-window: PT15M
  max-upload-size: 10MB
  storage-root: ./.data
  jobs-topic: docvalidate.validation-jobs
  # Makes the asynchronous lifecycle observable rather than instant.
  processing-delay: PT1S
  allowed-content-types:
    - application/pdf
    - image/png
    - image/jpeg
    - text/plain

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
